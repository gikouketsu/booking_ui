<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>房间预订</title>
  <style>
    body { font-family: Arial; padding:20px; margin:0; min-height:100vh; transition: background 0.5s; background-size:cover; background-position:center;}
    .container { max-width:420px; margin:50px auto; padding:20px; border-radius:10px; background:rgba(255,255,255,0.3); backdrop-filter: blur(5px);}
    h2 { text-align:center; color:#fff; text-shadow:1px 1px 2px rgba(0,0,0,0.7);}
    .form-group {margin-bottom:15px;}
    label {display:block; margin-bottom:6px; font-weight:bold; color:#fff; text-shadow:1px 1px 2px rgba(0,0,0,0.7);}
    select,input {width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; font-size:14px;}
    button {width:100%; padding:10px; border:none; background:#4CAF50; color:white; font-size:16px; border-radius:6px; cursor:pointer;}
    button:hover {background:#45a049;}
    #result {margin-top:15px; text-align:center; font-weight:bold; color:#2e7d32;}
    #calendar {margin-top:20px; display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center; background:rgba(255,255,255,0.2); padding:10px; border-radius:6px;}
    #calendar div {padding:10px; background:rgba(255,255,255,0.5); border-radius:4px;}
    #calendar .booked {background:red; color:white; font-weight:bold;}
  </style>
</head>
<body>
  <div class="container">
    <h2>房间预订</h2>
    <div class="form-group">
      <label for="room">房间</label>
      <select id="room" onchange="updateRoomBackground(); fetchBookings();">
        <option value="">请选择房间</option>
        <option value="1001">1001号</option>
        <option value="1002">1002号</option>
        <option value="1003">1003号</option>
        <option value="1004">1004号</option>
      </select>
    </div>
    <div class="form-group">
      <label for="checkin">入住日期</label>
      <input type="date" id="checkin">
    </div>
    <div class="form-group">
      <label for="checkout">退房日期</label>
      <input type="date" id="checkout">
    </div>
    <div class="form-group">
      <label for="people">人数</label>
      <select id="people">
        <option value="1">1人</option>
        <option value="2">2人</option>
        <option value="3">3人</option>
        <option value="4">4人</option>
      </select>
    </div>
    <div class="form-group">
      <label for="name">姓名</label>
      <input type="text" id="name" placeholder="请输入姓名">
    </div>
    <button onclick="submitBooking()">提交订单</button>
    <div id="result"></div>
    <div id="calendar"></div>
  </div>

<script>
const apiURL = "https://shrill-unit-bc8c.weizijie1218.workers.dev";
const roomImages = {
  "1001":"https://gikouketsu.github.io/booking_ui/images/1001.png",
  "1002":"https://gikouketsu.github.io/booking_ui/images/1002.png",
  "1003":"https://gikouketsu.github.io/booking_ui/images/1003.png",
  "1004":"https://gikouketsu.github.io/booking_ui/images/1004.png"
};

let bookings = {};

function updateRoomBackground(){
  const room = document.getElementById("room").value;
  const bg = roomImages[room] || "";
  document.body.style.backgroundImage = bg ? `url(${bg})` : "";
  document.body.style.backgroundSize="cover";
  document.body.style.backgroundPosition="center";
}

async function fetchBookings(){
  const room = document.getElementById("room").value;
  if(!room) return;
  try{
    const res = await fetch(apiURL);
    const data = await res.json();
    bookings = data;
    renderCalendar();
  }catch(e){
    console.error("获取预约失败", e);
  }
}

async function submitBooking(){
  const data = {
    room: document.getElementById("room").value,
    checkin: document.getElementById("checkin").value,
    checkout: document.getElementById("checkout").value,
    people: document.getElementById("people").value,
    name: document.getElementById("name").value
  };
  if(!data.room || !data.checkin || !data.checkout || !data.name){
    alert("请填写完整信息！");
    return;
  }

  try{
    const res = await fetch(apiURL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    const result = await res.json();
    if(result.error){
      alert("提交失败: " + result.error);
    }else{
      document.getElementById("result").innerText="预订成功！";
      bookings = result.bookings;
      renderCalendar();
    }
  }catch(e){
    console.error(e);
    alert("提交失败: " + e.message);
  }
}

function renderCalendar(){
  const room = document.getElementById("room").value;
  const calendar = document.getElementById("calendar");
  calendar.innerHTML="";
  if(!room) return;

  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const firstDay = new Date(year, month,1).getDay();
  const lastDate = new Date(year, month+1,0).getDate();

  for(let i=0;i<firstDay;i++){ calendar.appendChild(document.createElement("div")); }

  for(let d=1; d<=lastDate; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const div = document.createElement("div");
    div.innerText = d;
    const roomBookings = bookings[room] || [];
    if(roomBookings.some(b=>dateStr>=b.checkin && dateStr<=b.checkout)) div.classList.add("booked");
    calendar.appendChild(div);
  }
}
</script>
</body>
</html>
